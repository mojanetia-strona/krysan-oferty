<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Generator ofert KRYSAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: narzędzie dwupanelowe. Lewy panel = formularz, prawy = podgląd arkuszy A4 (papier zawsze jasny, marka KRYSAN czerń + czerwień). */
:root{
  --bg:#f3f2f1; --panel:#ffffff; --line:#e3e0de; --ink:#1b1918; --muted:#6f6a67;
  --accent:#c8102e; --accent-ink:#ffffff; --soft:#f7f5f4; --warn:#a15c00; --warn-bg:#fff4e0;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141312; --panel:#1d1b1a; --line:#2f2c2a; --ink:#ece8e5; --muted:#a39d99;
  --accent:#ef3a52; --accent-ink:#ffffff; --soft:#252220; --warn:#ffb347; --warn-bg:#3a2a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --panel:#1d1b1a; --line:#2f2c2a; --ink:#ece8e5; --muted:#a39d99;
  --accent:#ef3a52; --accent-ink:#ffffff; --soft:#252220; --warn:#ffb347; --warn-bg:#3a2a10; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:minmax(340px,430px) 1fr;height:100%}
.edit{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;min-width:0}
.view{overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px 24px;min-width:0}
.brandbar{position:sticky;top:0;z-index:5;background:var(--panel);display:flex;align-items:center;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-stretch:115%;letter-spacing:.14em;color:var(--accent);font-size:18px}
.mark::before{content:"";width:3px;height:20px;background:var(--accent)}
.brandbar small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 12px;font-weight:600;font-size:14px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
button.small{padding:5px 9px;font-size:13px}
.status{font-size:13px;color:var(--muted);min-height:20px}
details{border-bottom:1px solid var(--line);padding:4px 0}
summary{cursor:pointer;list-style:none;padding:12px 0;font-family:var(--display);font-weight:700;font-stretch:108%;font-size:13px;letter-spacing:.09em;text-transform:uppercase;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:500}
details[open] summary::after{content:"–"}
.fields{display:grid;gap:10px;padding-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
.check input{width:auto}
.note{font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 10px}
.list{display:grid;gap:6px}
.lrow{display:grid;gap:6px;align-items:center}
.lrow.spec{grid-template-columns:1fr 1.3fr auto}
.lrow.opt{grid-template-columns:auto 1fr 90px auto}
.lrow.std{grid-template-columns:1fr auto}
.lrow input{padding:6px 8px;font-size:13px}
.grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:68px;border-radius:6px;background:var(--soft) center/cover;border:1px solid var(--line)}
.thumb button{position:absolute;top:3px;right:3px;padding:0 6px;font-size:12px;line-height:18px;background:rgba(0,0,0,.6);color:#fff;border:0}
.thumb .lead{position:absolute;left:4px;bottom:3px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:1px 5px;border-radius:3px}
.saved{display:grid;gap:6px}
.sitem{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px}
.sitem b{display:block;font-size:13px}
.sitem span{color:var(--muted)}
.tabs{display:none}
.warnbox{max-width:794px;margin:0 auto 12px}
.pages{display:grid;gap:24px;justify-content:center}
.pagewrap{box-shadow:0 2px 14px rgba(0,0,0,.14);border-radius:2px;overflow:hidden;background:#fff}

/* ===== Arkusz oferty (zawsze jasny papier) ===== */
.pg{--p-ink:#141414;--p-muted:#6a6a6a;--p-line:#e2e2e2;--p-soft:#f5f5f5;--p-red:#d0021b;--p-black:#0e0e0e;
  width:794px;height:1123px;background:#ffffff;color:var(--p-ink);font-family:var(--body);font-size:12.5px;line-height:1.45;
  padding:46px 54px 0;display:flex;flex-direction:column;position:relative}
.pg-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:18px}
.hd{background:var(--p-black);border-radius:5px;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:3px solid var(--p-red)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-stretch:118%;letter-spacing:.16em;color:var(--p-red);font-size:27px;line-height:1}
.logo::before{content:"";width:3px;height:30px;background:var(--p-red)}
.co{text-align:right;color:#d6d6d6;font-size:11.5px;line-height:1.55}
.co b{color:#fff;font-size:12.5px;letter-spacing:.03em}
.ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:2px solid var(--p-ink);padding-bottom:10px}
.eye{font-family:var(--display);font-stretch:110%;font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--p-red)}
.ttl h1{font-family:var(--display);font-weight:800;font-stretch:105%;font-size:30px;line-height:1.05;margin:4px 0 2px;letter-spacing:-.005em}
.ttl .sub{color:var(--p-muted);font-size:13px}
.meta{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:11.5px;margin:0;white-space:nowrap}
.meta dt{color:var(--p-muted);text-align:right}
.meta dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.client{display:grid;grid-template-columns:120px 1fr;gap:10px;background:var(--p-soft);border-radius:4px;padding:12px 16px;font-size:12px}
.client .lbl{font-family:var(--display);font-stretch:110%;font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--p-muted);padding-top:2px}
.client b{font-size:13.5px}
.hero{height:360px;border-radius:4px;background:#ddd center/cover no-repeat}
.keys{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--p-line);border-bottom:1px solid var(--p-line)}
.key{padding:12px 14px;border-left:1px solid var(--p-line)}
.key:first-child{border-left:0;padding-left:0}
.key span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--p-muted);font-weight:600}
.key b{display:block;font-family:var(--display);font-stretch:105%;font-weight:700;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.key.price b{color:var(--p-red)}
.h2{font-family:var(--display);font-weight:800;font-stretch:110%;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.h2::after{content:"";flex:1;height:1px;background:var(--p-line)}
.lead-p{font-size:13.5px;line-height:1.6;margin:0;max-width:66ch}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td{padding:6px 0;border-bottom:1px solid var(--p-line);vertical-align:top}
.tbl td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:16px}
.tbl tr.grp td{border-bottom:0;padding:12px 0 3px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--p-red);font-weight:700}
.tbl tr.base td{font-weight:700;font-size:13px}
.tbl .incl{color:var(--p-muted);font-style:italic}
.cols2{columns:2;column-gap:28px;padding:0;margin:0;list-style:none;font-size:12px}
.cols2 li{break-inside:avoid;padding:4px 0 4px 16px;position:relative;border-bottom:1px solid var(--p-line)}
.cols2 li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:2px;background:var(--p-red)}
.sum{margin-left:auto;width:340px;font-size:12.5px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.sum .neg{color:var(--p-red)}
.sum .net{border-top:1px solid var(--p-ink);margin-top:4px;padding-top:8px;font-weight:700;font-size:14px}
.sum .gross{background:var(--p-black);color:#fff;border-radius:4px;padding:10px 14px;margin-top:6px;font-family:var(--display);font-stretch:105%;font-weight:700;font-size:16px}
.sum .gross span:last-child{color:#fff}
.sum .fromnote{font-size:10.5px;color:var(--p-muted);justify-content:flex-end}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.term{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--p-line);font-size:12px}
.term span{color:var(--p-muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal div{height:140px;border-radius:4px;background:#ddd center/cover no-repeat}
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;background:var(--p-black);color:#e8e8e8;border-radius:5px;padding:18px 22px;align-items:center}
.contact h3{font-family:var(--display);font-stretch:110%;font-weight:800;font-size:18px;color:#fff;margin:0 0 4px}
.contact p{margin:0;font-size:12px;color:#bdbdbd}
.contact .who{border-left:3px solid var(--p-red);padding-left:14px;font-size:12.5px;line-height:1.6}
.contact .who b{color:#fff;font-size:14px}
.fine{font-size:9.5px;color:var(--p-muted);line-height:1.5}
.ft{height:46px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--p-muted);border-top:1px solid var(--p-line);margin-top:14px}
.over{position:absolute;inset:auto 0 0 0;height:4px;background:var(--p-red)}

#render{position:fixed;left:-10000px;top:0}

@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .edit{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
  .tabs button{flex:1}
  .tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .brandbar{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="tabs" role="tablist">
  <button id="tabEdit" aria-pressed="true">Edycja</button>
  <button id="tabView" aria-pressed="false">Podgląd</button>
</div>

<div class="app">
  <aside class="edit" id="edit">
    <div class="brandbar"><span class="mark">KRYSAN</span><small>Generator ofert Aksoylu</small></div>
    <div class="actions">
      <button class="primary" id="btnPdf">Pobierz PDF</button>
      <button id="btnMail">Wyślij mailem</button>
      <button id="btnSave">Zapisz ofertę</button>
      <button id="btnNew">Nowa oferta</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>

    <details open>
      <summary>Szablony</summary>
      <div class="fields">
        <div class="list" id="tpls"></div>
        <div class="lrow std">
          <input id="tplName" placeholder="Nazwa szablonu, np. VECTUS 6 pełne wyposażenie" aria-label="Nazwa szablonu">
          <button class="small" id="tplSave">Zapisz</button>
        </div>
        <span class="status">Szablon zapamiętuje model, zdjęcia, ceny, opcje, specyfikację i warunki. Bez danych klienta.</span>
      </div>
    </details>

    <details open>
      <summary>Model</summary>
      <div class="fields">
        <label>Model z katalogu
          <select id="model"></select>
        </label>
        <div class="note" id="modelNote" hidden></div>
        <div class="row2">
          <label>Nazwa w ofercie<input id="p_name" data-b="product.name"></label>
          <label>Rok produkcji<input id="p_year" data-b="product.year"></label>
        </div>
        <label>Rodzaj<input id="p_type" data-b="product.type"></label>
        <label>Pojemność<input id="p_cap" data-b="product.capacity"></label>
        <label>Opis (strona 1)<textarea id="p_sum" data-b="product.summary" rows="4"></textarea></label>
      </div>
    </details>

    <details open>
      <summary>Klient i oferta</summary>
      <div class="fields">
        <label>Firma klienta<input id="c_co" data-b="client.company" placeholder="np. Trans-Auto Sp. z o.o."></label>
        <div class="row2">
          <label>Osoba kontaktowa<input id="c_p" data-b="client.person"></label>
          <label>NIP<input id="c_nip" data-b="client.nip"></label>
        </div>
        <label>Adres<input id="c_adr" data-b="client.address"></label>
        <label>E-mail / telefon<input id="c_ct" data-b="client.contact"></label>
        <div class="row2">
          <label>Numer oferty<input id="o_no" data-b="offer.no"></label>
          <label>Data wydania<input id="o_date" type="date" data-b="offer.date"></label>
        </div>
        <label>Ważna do<input id="o_valid" type="date" data-b="offer.valid"></label>
      </div>
    </details>

    <details>
      <summary>Zdjęcia</summary>
      <div class="fields">
        <div class="photos" id="photos"></div>
        <label>Dodaj zdjęcia (pierwsze = główne, kolejne 3 trafiają do galerii)
          <input id="photoIn" type="file" accept="image/*" multiple>
        </label>
      </div>
    </details>

    <details>
      <summary>Cena i rabat</summary>
      <div class="fields">
        <div class="row2">
          <label>Cena bazowa netto<input id="pr_base" type="number" step="100" data-b="price.base" data-num></label>
          <label>Waluta<select id="pr_cur" data-b="offer.currency"><option>EUR</option><option>PLN</option></select></label>
        </div>
        <div class="row2">
          <label>Rabat netto (kwota)<input id="pr_disc" type="number" step="100" data-b="price.discount" data-num></label>
          <label>VAT %<input id="pr_vat" type="number" data-b="offer.vat" data-num></label>
        </div>
        <label class="check"><input id="pr_from" type="checkbox" data-b="offer.from"> Pokazuj „cena od”</label>
      </div>
    </details>

    <details>
      <summary>Wyposażenie dodatkowe</summary>
      <div class="fields">
        <div class="list" id="opts"></div>
        <button class="small" id="addOpt">Dodaj pozycję</button>
      </div>
    </details>

    <details>
      <summary>Wyposażenie standardowe</summary>
      <div class="fields">
        <div class="list" id="stds"></div>
        <button class="small" id="addStd">Dodaj pozycję</button>
      </div>
    </details>

    <details>
      <summary>Specyfikacja techniczna</summary>
      <div class="fields">
        <div class="list" id="specs"></div>
        <button class="small" id="addSpec">Dodaj parametr</button>
      </div>
    </details>

    <details>
      <summary>Warunki</summary>
      <div class="fields">
        <label>Termin dostawy<input id="t_del" data-b="terms.delivery"></label>
        <label>Warunki płatności<input id="t_pay" data-b="terms.payment"></label>
        <label>Gwarancja<input id="t_war" data-b="terms.warranty"></label>
        <label>Finansowanie<input id="t_fin" data-b="terms.financing"></label>
        <label>Miejsce odbioru<input id="t_pick" data-b="terms.pickup"></label>
        <label>Uwagi dodatkowe<textarea id="t_notes" data-b="terms.notes" rows="3"></textarea></label>
      </div>
    </details>

    <details>
      <summary>Sprzedawca</summary>
      <div class="fields">
        <label>Firma<input id="s_co" data-b="seller.company"></label>
        <label>Adres<input id="s_adr" data-b="seller.address"></label>
        <div class="row2">
          <label>NIP<input id="s_nip" data-b="seller.nip"></label>
          <label>Telefon<input id="s_tel" data-b="seller.phone"></label>
        </div>
        <div class="row2">
          <label>Handlowiec<input id="s_name" data-b="seller.person"></label>
          <label>E-mail<input id="s_mail" data-b="seller.email"></label>
        </div>
      </div>
    </details>

    <details>
      <summary>Zapisane oferty</summary>
      <div class="fields"><div class="saved" id="saved"></div></div>
    </details>
  </aside>

  <main class="view" id="view">
    <div class="warnbox" id="warn"></div>
    <div class="pages" id="pages"></div>
  </main>
</div>
<div id="render" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const iso = d => d.toISOString().slice(0,10);
const plDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}.${m}.${y}`; };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

function nextNo(){
  const y = new Date().getFullYear();
  const n = (store.get("krysan_seq") || 0) + 1;
  return `OF/KRY/${y}/${String(n).padStart(3,"0")}`;
}

function fromModel(key, keep){
  const m = CATALOG[key];
  const now = new Date(), valid = new Date(now.getTime() + 14*864e5);
  const base = keep || {
    offer:{no:nextNo(), date:iso(now), valid:iso(valid), currency:"EUR", vat:23, from:m.from},
    client:{company:"", person:"", nip:"", address:"", contact:""},
    seller:clone(SELLER), terms:clone(TERMS)
  };
  return Object.assign(base, {
    model:key,
    product:{name:m.name, type:m.type, year:m.year, capacity:m.capacity, summary:m.summary},
    photos:[key.startsWith("vectus") ? "DEFAULT" : null].filter(Boolean),
    specs:m.specs.map(([g,l,v])=>({g,l,v})),
    std:m.std.slice(),
    opts:COMMON_OPTS.map(o=>({g:o.g, n:o.n, p:0, on:false})),
    price:{base:m.base, discount:0}
  });
}

let S = store.get("krysan_draft") || fromModel("vectus6");
S.offer.from = !!S.offer.from;

const getP = p => p.split(".").reduce((o,k)=>o?.[k], S);
const setP = (p,v) => { const ks=p.split("."); const last=ks.pop(); ks.reduce((o,k)=>o[k],S)[last]=v; };
const photoSrc = p => p === "DEFAULT" ? PHOTO : p;
const money = (v, cur) => new Intl.NumberFormat("pl-PL",{style:"currency",currency:cur||"EUR",maximumFractionDigits:0}).format(v||0);

/* ===== Formularz ===== */
function fillForm(){
  const sel = $("model");
  sel.innerHTML = Object.entries(CATALOG).map(([k,m])=>`<option value="${k}">${esc(m.label)}</option>`).join("");
  sel.value = S.model;
  document.querySelectorAll("[data-b]").forEach(el=>{
    const v = getP(el.dataset.b);
    if(el.type === "checkbox") el.checked = !!v; else el.value = v ?? "";
  });
  modelNote(); drawLists(); drawPhotos();
}
function modelNote(){
  const m = CATALOG[S.model], n = $("modelNote");
  n.hidden = !m.check;
  n.textContent = "Dane tego modelu pochodzą z ogłoszeń innych dealerów. Sprawdź parametry i wpisz cenę przed wysłaniem.";
}

function drawLists(){
  // opcje pogrupowane
  let html = "", last = null;
  S.opts.forEach((o,i)=>{
    if(o.g !== last){ html += `<div class="grp">${esc(o.g||"Inne")}</div>`; last = o.g; }
    html += `<div class="lrow opt">
      <input type="checkbox" id="oon${i}" data-l="opts.${i}.on" ${o.on?"checked":""} aria-label="Uwzględnij w ofercie">
      <input id="on${i}" data-l="opts.${i}.n" value="${esc(o.n)}" aria-label="Nazwa">
      <input id="op${i}" type="number" step="50" data-l="opts.${i}.p" value="${o.p||""}" placeholder="w cenie" aria-label="Cena netto">
      <button class="ghost" data-del="opts.${i}" aria-label="Usuń">✕</button></div>`;
  });
  $("opts").innerHTML = html;

  $("stds").innerHTML = S.std.map((s,i)=>`<div class="lrow std">
    <input id="st${i}" data-l="std.${i}" value="${esc(s)}" aria-label="Pozycja">
    <button class="ghost" data-del="std.${i}" aria-label="Usuń">✕</button></div>`).join("");

  html = ""; last = null;
  S.specs.forEach((s,i)=>{
    if(s.g !== last){ html += `<div class="grp">${esc(s.g||"Inne")}</div>`; last = s.g; }
    html += `<div class="lrow spec">
      <input id="sl${i}" data-l="specs.${i}.l" value="${esc(s.l)}" aria-label="Parametr">
      <input id="sv${i}" data-l="specs.${i}.v" value="${esc(s.v)}" aria-label="Wartość">
      <button class="ghost" data-del="specs.${i}" aria-label="Usuń">✕</button></div>`;
  });
  $("specs").innerHTML = html;
}

function drawPhotos(){
  $("photos").innerHTML = S.photos.map((p,i)=>`<div class="thumb" style="background-image:url('${photoSrc(p)}')">
    ${i===0?'<span class="lead">główne</span>':''}
    <button data-photo="${i}" aria-label="Usuń zdjęcie">✕</button></div>`).join("") ||
    `<span class="status">Brak zdjęć. Dodaj zdjęcie naczepy.</span>`;
}

document.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset.b){
    let v = el.type==="checkbox" ? el.checked : el.value;
    if("num" in el.dataset) v = parseFloat(v)||0;
    setP(el.dataset.b, v); changed();
  } else if(el.dataset.l){
    const [arr, i, f] = el.dataset.l.split(".");
    let v = el.type==="checkbox" ? el.checked : el.value;
    if(f==="p") v = parseFloat(v)||0;
    if(f) S[arr][i][f] = v; else S[arr][i] = v;
    changed();
  }
});
document.addEventListener("click", e=>{
  const d = e.target.closest("[data-del]");
  if(d){ const [arr,i] = d.dataset.del.split("."); S[arr].splice(+i,1); drawLists(); changed(); }
  const ph = e.target.closest("[data-photo]");
  if(ph){ S.photos.splice(+ph.dataset.photo,1); drawPhotos(); changed(); }
});
$("model").addEventListener("change", e=>{
  const keep = {offer:S.offer, client:S.client, seller:S.seller, terms:S.terms};
  S = fromModel(e.target.value, keep);
  S.offer.from = CATALOG[S.model].from;
  fillForm(); changed();
});
$("addOpt").onclick = ()=>{ S.opts.push({g:"Inne", n:"", p:0, on:true}); drawLists(); changed(); $("on"+(S.opts.length-1)).focus(); };
$("addStd").onclick = ()=>{ S.std.push(""); drawLists(); $("st"+(S.std.length-1)).focus(); };
$("addSpec").onclick = ()=>{ S.specs.push({g:"Inne", l:"", v:""}); drawLists(); $("sl"+(S.specs.length-1)).focus(); };

$("photoIn").addEventListener("change", async e=>{
  for(const f of e.target.files){ S.photos.push(await shrink(f)); }
  e.target.value = ""; drawPhotos(); changed();
});
function shrink(file){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const max = 1600, k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = img.width*k; c.height = img.height*k;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

function totals(){
  const extra = S.opts.filter(o=>o.on).reduce((a,o)=>a+(+o.p||0),0);
  const net = (+S.price.base||0) + extra - (+S.price.discount||0);
  const vat = net * (+S.offer.vat||0) / 100;
  return {extra, net, vat, gross: net+vat};
}

}

    <div><div class="h2">Warunki</div><div class="terms">${termRows}</div></div>
    ${T.notes ? `<p class="lead-p" style="font-size:12px">${esc(T.notes)}</p>` : ""}`;

  let specRows = ""; last=null;
  S.specs.filter(s=>s.l||s.v).forEach(s=>{ if(s.g!==last){ specRows += `<tr class="grp"><td colspan="2">${esc(s.g||"Inne")}</td></tr>`; last=s.g; }
    specRows += `<tr><td>${esc(s.l)}</td><td class="r" style="white-space:normal;text-align:right">${esc(s.v)}</td></tr>`; });
  const gal = photos.slice(1,4);
  const sl = S.seller;
  const p3 = `${header()}
    <div class="ttl"><div><div class="eye">Specyfikacja techniczna</div><h1>${esc(P.name)}</h1></div></div>
    <table class="tbl">${specRows}</table>
    ${gal.length ? `<div class="gal">${gal.map(g=>`<div style="background-image:url('${g}')"></div>`).join("")}</div>` : ""}
    <div style="margin-top:auto;display:grid;gap:12px">
      <div class="contact"><div><h3>Zapraszamy do kontaktu i rezerwacji</h3><p>Chętnie przygotujemy konfigurację pod Państwa flotę i omówimy finansowanie.</p></div>
        <div class="who"><b>${esc(sl.person)}</b><br>tel. ${esc(sl.phone)}${sl.email?`<br>${esc(sl.email)}`:""}<br>${esc(sl.address)}</div></div>
      <p class="fine">Niniejsza oferta ma charakter informacyjny i nie stanowi oferty w rozumieniu art. 66 § 1 Kodeksu cywilnego. Ceny podano w kwotach netto, do których należy doliczyć podatek VAT. Masy i wymiary są wartościami przybliżonymi, podanymi bez wyposażenia dodatkowego. Zdjęcia mają charakter poglądowy i mogą przedstawiać wyposażenie dodatkowe. Producent zastrzega sobie prawo do zmian konstrukcyjnych.</p>
    </div>`;
  return [p1,p2,p3];
}

function buildPages(container){
  const list = pages();
  container.innerHTML = list.map((h,i)=>`<div class="pg"><div class="pg-body">${h}</div>${footer(i+1,list.length)}</div>`).join("");
  return [...container.querySelectorAll(".pg")];
}

let zoom = 1;
function render(){
  const host = $("pages");
  host.innerHTML = "";
  const tmp = document.createElement("div");
  const pgs = buildPages(tmp);
  const warn = [];
  const avail = Math.min(794, $("view").clientWidth - 48);
  zoom = Math.max(0.3, avail/794);
  pgs.forEach((pg,i)=>{
    const w = document.createElement("div"); w.className = "pagewrap";
    w.style.width = (794*zoom)+"px"; w.style.height = (1123*zoom)+"px";
    pg.style.transform = `scale(${zoom})`; pg.style.transformOrigin = "0 0";
    w.appendChild(pg); host.appendChild(w);
    const b = pg.querySelector(".pg-body");
    if(b.scrollHeight > b.clientHeight + 2){ warn.push(i+1); pg.insertAdjacentHTML("beforeend",'<div class="over"></div>'); }
  });
  $("warn").innerHTML = warn.length ? `<div class="note">Strona ${warn.join(", ")} nie mieści treści. Skróć opis lub listę pozycji.</div>` : "";
}

let t1;
function changed(){
  clearTimeout(t1);
  t1 = setTimeout(()=>{ render(); if(!store.set("krysan_draft", S)) status("Nie udało się zapisać szkicu w przeglądarce (za duże zdjęcia)."); }, 120);
}
function status(m){ $("status").textContent = m; }

/* ===== PDF i e-mail ===== */
async function makePdf(){
  await document.fonts.ready;
  const box = $("render");
  const pgs = buildPages(box);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
  for(let i=0;i<pgs.length;i++){
    const c = await html2canvas(pgs[i], {scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false});
    if(i) pdf.addPage();
    pdf.addImage(c.toDataURL("image/jpeg",0.9), "JPEG", 0, 0, 210, 297);
  }
  box.innerHTML = "";
  const name = `Oferta ${S.offer.no.replace(/\//g,"-")} ${S.product.name}${S.client.company?" "+S.client.company:""}.pdf`.replace(/[\\:*?"<>|]/g,"");
  bumpSeq();
  return {pdf, name};
}

$("btnPdf").onclick = async ()=>{
  const btn = $("btnPdf"); btn.disabled = true; status("Tworzę PDF…");
  try{ const {pdf, name} = await makePdf(); pdf.save(name); status("PDF pobrany: " + name); }
  catch(e){ status("Nie udało się utworzyć PDF. Spróbuj ponownie."); }
  finally{ btn.disabled = false; }
};

function mailText(){
  const P = S.product, s = S.seller;
  const subject = `Oferta ${S.offer.no}: ${P.name}`;
  const hello = S.client.person ? `Dzień dobry ${S.client.person},` : "Dzień dobry,";
  const body = `${hello}

w załączeniu przesyłam ofertę handlową na ${P.name}${P.capacity ? " (" + P.capacity + ")" : ""}.
Oferta jest ważna do ${plDate(S.offer.valid)}.

Chętnie odpowiem na pytania, przygotuję konfigurację pod Państwa potrzeby i omówię możliwości finansowania.

Z poważaniem
${s.person}
${s.company}
tel. ${s.phone}${s.email ? "\n" + s.email : ""}`;
  return {subject, body};
}

$("btnMail").onclick = async ()=>{
  const btn = $("btnMail"); btn.disabled = true; status("Przygotowuję wiadomość…");
  try{
    const {pdf, name} = await makePdf();
    const {subject, body} = mailText();
    const file = new File([pdf.output("blob")], name, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:subject, text:body}); status("Wybierz aplikację pocztową i wyślij."); }
      catch(e){ status(e.name==="AbortError" ? "Wysyłanie anulowane." : "Nie udało się otworzyć udostępniania."); }
    } else {
      pdf.save(name);
      const to = (S.client.contact.match(/[^\s,;]+@[^\s,;]+/)||[""])[0];
      location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      status("PDF pobrany, otwieram program pocztowy. Dołącz pobrany plik jako załącznik.");
    }
  }catch(e){ status("Nie udało się przygotować wiadomości. Spróbuj ponownie."); }
  finally{ btn.disabled = false; }
};

function bumpSeq(){
  const m = /\/(\d+)$/.exec(S.offer.no);
  if(m) store.set("krysan_seq", Math.max(store.get("krysan_seq")||0, +m[1]));
}

/* ===== Szablony ===== */
function tplList(){ return store.get("krysan_templates") || []; }
function drawTpls(){
  const L = tplList();
  $("tpls").innerHTML = L.length ? L.map((t,i)=>`<div class="sitem"><div><b>${esc(t.name)}</b><span>${esc(t.state.product.name)}${t.state.price.base?" · "+money(t.state.price.base,t.state.offer.currency):""}</span></div>
    <button class="small primary" data-tuse="${i}">Nowa oferta</button><button class="small ghost" data-trm="${i}">Usuń</button></div>`).join("")
    : `<span class="status">Brak szablonów. Skonfiguruj ofertę i zapisz ją poniżej.</span>`;
}
$("tplSave").onclick = ()=>{
  const name = $("tplName").value.trim() || S.product.name;
  const t = clone(S);
  t.client = {company:"", person:"", nip:"", address:"", contact:""};
  delete t.offer.no; delete t.offer.date; delete t.offer.valid;
  const L = tplList().filter(x=>x.name !== name);
  L.unshift({name, state:t});
  if(store.set("krysan_templates", L)){ $("tplName").value = ""; drawTpls(); status(`Zapisano szablon „${name}”.`); }
  else status("Brak miejsca w przeglądarce. Usuń stare szablony lub zmniejsz liczbę zdjęć.");
};
$("tpls").addEventListener("click", e=>{
  const u = e.target.closest("[data-tuse]"), r = e.target.closest("[data-trm]");
  if(u){
    bumpSeq();
    const t = clone(tplList()[+u.dataset.tuse].state);
    const now = new Date();
    t.offer.no = nextNo(); t.offer.date = iso(now); t.offer.valid = iso(new Date(now.getTime()+14*864e5));
    S = t; fillForm(); changed();
    status(`Nowa oferta ${S.offer.no} z szablonu. Uzupełnij dane klienta.`);
    const c = $("c_co"); c.closest("details").open = true; c.focus();
  }
  if(r){
    if(r.dataset.sure){ const L = tplList(); L.splice(+r.dataset.trm,1); store.set("krysan_templates",L); drawTpls(); }
    else { r.dataset.sure = "1"; r.textContent = "Na pewno?"; }
  }
});

/* ===== Zapisane oferty ===== */
function savedList(){ return store.get("krysan_offers") || []; }
function drawSaved(){
  const L = savedList();
  $("saved").innerHTML = L.length ? L.map((o,i)=>`<div class="sitem"><div><b>${esc(o.no)}</b><span>${esc(o.client||"bez klienta")} · ${esc(o.model)}</span></div>
    <button class="small" data-open="${i}">Otwórz</button><button class="small ghost" data-rm="${i}">Usuń</button></div>`).join("")
    : `<span class="status">Brak zapisanych ofert.</span>`;
}
$("btnSave").onclick = ()=>{
  const L = savedList().filter(o=>o.no !== S.offer.no);
  L.unshift({no:S.offer.no, client:S.client.company||S.client.person, model:S.product.name, state:clone(S)});
  if(store.set("krysan_offers", L.slice(0,40))){ bumpSeq(); status(`Zapisano ofertę ${S.offer.no}.`); drawSaved(); }
  else status("Brak miejsca w przeglądarce. Usuń starsze oferty lub zdjęcia.");
};
$("btnNew").onclick = ()=>{
  bumpSeq();
  S = fromModel(S.model);
  fillForm(); changed(); status("Nowa oferta "+S.offer.no+".");
};
$("saved").addEventListener("click", e=>{
  const o = e.target.closest("[data-open]"), r = e.target.closest("[data-rm]");
  if(o){ S = clone(savedList()[+o.dataset.open].state); fillForm(); changed(); status("Otworzono "+S.offer.no+"."); }
  if(r){
    if(r.dataset.sure){ const L = savedList(); L.splice(+r.dataset.rm,1); store.set("krysan_offers",L); drawSaved(); }
    else { r.dataset.sure = "1"; r.textContent = "Na pewno?"; }
  }
});

/* ===== Zakładki (telefon) ===== */
function tab(v){
  $("tabEdit").setAttribute("aria-pressed", !v); $("tabView").setAttribute("aria-pressed", v);
  if(matchMedia("(max-width:900px)").matches){ $("edit").hidden = v; $("view").hidden = !v; if(v) render(); }
}
$("tabEdit").onclick = ()=>tab(false);
$("tabView").onclick = ()=>tab(true);
matchMedia("(max-width:900px)").addEventListener("change", e=>{ if(!e.matches){ $("edit").hidden=false; $("view").hidden=false; } else tab(false); render(); });
if(matchMedia("(max-width:900px)").matches) $("view").hidden = true;

addEventListener("resize", ()=>{ clearTimeout(t1); t1=setTimeout(render,150); });
fillForm(); drawSaved(); drawTpls();
document.fonts.ready.then(render); render();
</script>

</body>
</html>
